[tox]
envlist = py311
isolated_build = true

[testenv]
extras =
commands = pytest tests --cov=freeiam.web --cov-branch --cov-report=term-missing

[testenv:docs]
deps = sphinx furo
description = Build Sphinx documentation
commands = sphinx-build -W -b html docs docs/_build/html

[testenv:lint]
deps = ruff
commands = ruff check src/ tests/

[testenv:build]
deps = build
commands = python -m build

[testenv:publish]
deps = twine
commands = twine upload dist/*

[testenv:changelog]
deps = python-semantic-release
commands = semantic-release version --no-push --skip-build --changelog
